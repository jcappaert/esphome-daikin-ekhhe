# Exercise the timestamp path without a physical UART or heat pump.
esphome:
  name: daikin-current-time-test
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(daikin_component).update_timestamp(12, 34);
          const std::string published = id(current_time_sensor).state;
          if (published.size() != 20 || published.substr(10) != "T12:34:00Z") {
            ESP_LOGE("current_time_test", "Unexpected timestamp: %s", published.c_str());
            std::exit(1);
          }

          // A missing clock must not crash or overwrite the last good value.
          id(daikin_component).set_time(nullptr);
          id(daikin_component).update_timestamp(13, 45);
          if (id(current_time_sensor).state != published) {
            std::exit(1);
          }
          ESP_LOGI("current_time_test", "Timestamp publication and null-clock guard passed");
          std::exit(0);

host:
logger:

time:
  - platform: host
    id: test_time
    timezone: UTC

external_components:
  - source:
      type: local
      path: ../../../components
    components: [daikin_ekhhe]

uart:
  id: my_uart
  port: /dev/null
  baud_rate: 9600

daikin_ekhhe:
  id: daikin_component

text_sensor:
  - platform: daikin_ekhhe
    current_time:
      id: current_time_sensor
      name: Current Time
      time_id: test_time
